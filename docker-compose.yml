# Optional local database: Postgres 16. Without DATABASE_URL the app uses embedded PGlite instead.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: trueharvest
      POSTGRES_PASSWORD: trueharvest
      POSTGRES_DB: trueharvest
    ports:
      - "5432:5432"
    volumes:
      - th-db:/var/lib/postgresql/data
volumes:
  th-db:
