<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef0e4"/>
      <stop offset="0.55" stop-color="#f5f1e1"/>
      <stop offset="1" stop-color="#e8e6cf"/>
    </linearGradient>
    <linearGradient id="field" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a9bf86"/>
      <stop offset="0.35" stop-color="#7fa35c"/>
      <stop offset="1" stop-color="#4f7d3a"/>
    </linearGradient>
    <linearGradient id="mist" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7f5ee" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#f7f5ee" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#f7f5ee" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.72" cy="0.32" r="0.35">
      <stop offset="0" stop-color="#fff6d8" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#fff6d8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="rows" width="1600" height="420" patternUnits="userSpaceOnUse"/>
  </defs>
  <rect width="1600" height="700" fill="url(#sky)"/>
  <rect width="1600" height="700" fill="url(#sun)"/>
  <!-- distant tree line -->
  <path d="M0 318 C60 300 90 312 140 298 C190 286 230 304 280 296 C330 284 380 300 430 292 C470 286 520 300 580 294 C640 286 690 302 750 296 C820 288 860 304 930 296 C990 290 1040 302 1100 294 C1160 286 1210 300 1270 292 C1330 286 1380 302 1440 296 C1500 290 1550 300 1600 294 L1600 340 L0 340 Z" fill="#9fb08a" opacity="0.7"/>
  <path d="M0 330 C80 318 140 326 220 318 C300 312 360 324 450 318 C540 312 600 326 700 320 C800 314 880 326 980 320 C1080 314 1150 326 1250 320 C1350 314 1450 326 1600 318 L1600 350 L0 350 Z" fill="#8aa173" opacity="0.8"/>
  <!-- field -->
  <path d="M0 342 L1600 342 L1600 700 L0 700 Z" fill="url(#field)"/>
  <!-- crop rows converging on a vanishing point -->
  <g stroke="#3f6b2e" stroke-linecap="round" opacity="0.55" fill="none">
    <path d="M800 342 L-900 700" stroke-width="10"/>
    <path d="M800 342 L-500 700" stroke-width="10"/>
    <path d="M800 342 L-150 700" stroke-width="11"/>
    <path d="M800 342 L150 700" stroke-width="12"/>
    <path d="M800 342 L420 700" stroke-width="13"/>
    <path d="M800 342 L660 700" stroke-width="14"/>
    <path d="M800 342 L900 700" stroke-width="14"/>
    <path d="M800 342 L1140 700" stroke-width="13"/>
    <path d="M800 342 L1390 700" stroke-width="12"/>
    <path d="M800 342 L1660 700" stroke-width="11"/>
    <path d="M800 342 L1950 700" stroke-width="10"/>
    <path d="M800 342 L2300 700" stroke-width="10"/>
  </g>
  <g stroke="#c8d6a6" stroke-linecap="round" opacity="0.35" fill="none">
    <path d="M800 342 L-320 700" stroke-width="5"/>
    <path d="M800 342 L0 700" stroke-width="6"/>
    <path d="M800 342 L290 700" stroke-width="6"/>
    <path d="M800 342 L540 700" stroke-width="7"/>
    <path d="M800 342 L780 700" stroke-width="7"/>
    <path d="M800 342 L1020 700" stroke-width="7"/>
    <path d="M800 342 L1265 700" stroke-width="6"/>
    <path d="M800 342 L1520 700" stroke-width="6"/>
